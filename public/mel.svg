<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Oscuro Moderno (Dark Mode) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gradiente Tecnológico -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Fondo con esquinas redondeadas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Nombre Completo Acomodado y Centrado -->
  <text x="256" y="276" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="72" 
        font-weight="800" 
        fill="url(#textGrad)" 
        letter-spacing="16" 
        text-anchor="middle">MELS</text>

  <!-- Línea decorativa minimalista de código -->
  <line x1="200" y1="320" x2="312" y2="320" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
