<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Minimalista Oscuro (Ideal para portafolios dev) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gradiente de acento tecnológico -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Fondo con esquinas redondeadas (tipo app/favicon moderno) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Acentos minimalistas de código (Corchetes < / > discretos a los lados) -->
  <g stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4">
    <!-- Corchete izquierdo -->
    <path d="M 140 220 L 105 256 L 140 292" />
    <!-- Corchete derecho -->
    <path d="M 372 220 L 407 256 L 372 292" />
  </g>

  <!-- Línea divisoria / barra de código sutil -->
  <line x1="216" y1="290" x2="296" y2="290" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Nombre principal: MELS -->
  <text x="256" y="258" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="64" 
        font-weight="800" 
        fill="#f8fafc" 
        letter-spacing="12" 
        text-anchor="middle">MELS</text>

  <!-- Subtítulo técnico minimalista -->
  <text x="256" y="328" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="600" 
        fill="#38bdf8" 
        letter-spacing="8" 
        text-anchor="middle">DEV &amp; SYSTEMS</text>
</svg>
